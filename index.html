<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trackpad Click Practice</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f8fb;
    color: #1f2937;
  }
  body.game-open {
    overflow: hidden;
  }
  .app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 22px;
  }
  header {
    text-align: center;
    margin-bottom: 22px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(34px, 5vw, 54px);
    line-height: 1;
  }
  .subtitle {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    color: #586174;
  }
  .pill {
    display: inline-block;
    margin-top: 13px;
    padding: 8px 15px;
    border-radius: 999px;
    background: white;
    border: 2px solid #d8dde7;
    font-size: 14px;
    font-weight: 900;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 15px;
  }
  .game-card {
    min-height: 145px;
    border: 3px solid #dce1ea;
    border-radius: 22px;
    background: white;
    cursor: pointer;
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: inherit;
    box-shadow: 0 3px 0 rgba(0,0,0,.05);
  }
  .game-card:hover,
  .game-card:focus-visible {
    border-color: #70798c;
    outline: none;
    transform: translateY(-2px);
  }
  .game-card:active {
    transform: translateY(0);
  }
  .icon {
    font-size: 48px;
    line-height: 1;
  }
  .game-name {
    font-size: 21px;
    font-weight: 900;
    text-align: center;
    line-height: 1.1;
  }

  #gameScreen {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #eef1f5;
  }
  #gameScreen.show {
    display: flex;
    flex-direction: column;
  }
  .game-toolbar {
    flex: 0 0 auto;
    min-height: 64px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    background: white;
    border-bottom: 2px solid #d9dee7;
  }
  .toolbar-btn {
    min-height: 46px;
    border: 0;
    border-radius: 12px;
    padding: 8px 15px;
    background: #202734;
    color: white;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
  }
  .toolbar-btn.secondary {
    background: #e9edf3;
    color: #202734;
  }
  #currentTitle {
    flex: 1;
    min-width: 0;
    text-align: center;
    font-size: 22px;
    font-weight: 900;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .frame-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 6px;
    background: #e8ebf0;
  }
  #gameFrame {
    width: 100%;
    height: 100%;
    border: 0;
    background: white;
  }
  .footer {
    text-align: center;
    margin-top: 24px;
    color: #697386;
    font-size: 13px;
    font-weight: 700;
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
  }
  @media (max-width: 680px) {
    .app { padding: 14px; }
    .grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .game-card { min-height: 125px; }
    .icon { font-size: 40px; }
    .game-name { font-size: 18px; }
    #currentTitle { font-size: 17px; }
    .toolbar-btn { font-size: 15px; padding: 7px 11px; }
  }
</style>
</head>
<body>
<div class="app" id="menuScreen">
  <header>
    <h1>Trackpad Click Practice</h1>
    <p class="subtitle">Choose a game and practice clicking.</p>
    <div class="pill">CLICK ONLY • NO DRAGGING • NO MOUSE HOUSE PAGE</div>
  </header>

  <main class="grid">
    <button class="game-card" type="button"
        data-name="Apple Catch"
        data-url="https://mouse-practice.com/games/mp/mp01/g01/index.html">
      <span class="icon" aria-hidden="true">🍎</span>
      <span class="game-name">Apple Catch</span>
    </button>
<button class="game-card" type="button"
        data-name="Bumble Numbers"
        data-url="https://mouse-practice.com/games/mp/mp01/g02/index.html">
      <span class="icon" aria-hidden="true">🐝</span>
      <span class="game-name">Bumble Numbers</span>
    </button>
<button class="game-card" type="button"
        data-name="Cake Monster"
        data-url="https://mouse-practice.com/games/mp/mp01/g03/index.html">
      <span class="icon" aria-hidden="true">🍰</span>
      <span class="game-name">Cake Monster</span>
    </button>
<button class="game-card" type="button"
        data-name="Coyote Concentration"
        data-url="https://www.funbrain.com/content/js_games/coyote_concentration/game.html">
      <span class="icon" aria-hidden="true">🃏</span>
      <span class="game-name">Coyote Concentration</span>
    </button>
<button class="game-card" type="button"
        data-name="Digging for Worms"
        data-url="https://mouse-practice.com/games/mp/mp01/g07/index.html">
      <span class="icon" aria-hidden="true">🪱</span>
      <span class="game-name">Digging for Worms</span>
    </button>
<button class="game-card" type="button"
        data-name="Frost Bite"
        data-url="https://mouse-practice.com/games/mp/mp01/g08/index.html">
      <span class="icon" aria-hidden="true">❄️</span>
      <span class="game-name">Frost Bite</span>
    </button>
<button class="game-card" type="button"
        data-name="Log Run"
        data-url="https://mouse-practice.com/games/mp/mp01/g10/index.html">
      <span class="icon" aria-hidden="true">🪵</span>
      <span class="game-name">Log Run</span>
    </button>
<button class="game-card" type="button"
        data-name="Penguin Drop"
        data-url="https://mouse-practice.com/games/mp/mp01/g12/index.html">
      <span class="icon" aria-hidden="true">🐧</span>
      <span class="game-name">Penguin Drop</span>
    </button>
<button class="game-card" type="button"
        data-name="Pickle Pop"
        data-url="https://mouse-practice.com/games/mp/mp01/g13/index.html">
      <span class="icon" aria-hidden="true">🥒</span>
      <span class="game-name">Pickle Pop</span>
    </button>
<button class="game-card" type="button"
        data-name="Pig Pile"
        data-url="https://mouse-practice.com/games/mp/mp01/g14/index.html">
      <span class="icon" aria-hidden="true">🐷</span>
      <span class="game-name">Pig Pile</span>
    </button>
<button class="game-card" type="button"
        data-name="Shape Invasion"
        data-url="https://mouse-practice.com/games/mp/mp01/g16/index.html">
      <span class="icon" aria-hidden="true">🔷</span>
      <span class="game-name">Shape Invasion</span>
    </button>
<button class="game-card" type="button"
        data-name="Simon Sees"
        data-url="https://mouse-practice.com/games/mp/mp01/g17/index.html">
      <span class="icon" aria-hidden="true">👀</span>
      <span class="game-name">Simon Sees</span>
    </button>
<button class="game-card" type="button"
        data-name="Star Climber"
        data-url="https://mouse-practice.com/games/mp/mp01/g18/index.html">
      <span class="icon" aria-hidden="true">⭐</span>
      <span class="game-name">Star Climber</span>
    </button>
<button class="game-card" type="button"
        data-name="Swing Fling"
        data-url="https://mouse-practice.com/games/mp/mp01/g19/index.html">
      <span class="icon" aria-hidden="true">🐦</span>
      <span class="game-name">Swing Fling</span>
    </button>
<button class="game-card" type="button"
        data-name="Switch"
        data-url="https://mouse-practice.com/games/mp/mp01/g20/index.html">
      <span class="icon" aria-hidden="true">🍓</span>
      <span class="game-name">Switch</span>
    </button>
<button class="game-card" type="button"
        data-name="Treasure Dive"
        data-url="https://mouse-practice.com/games/mp/mp01/g21/index.html">
      <span class="icon" aria-hidden="true">🤿</span>
      <span class="game-name">Treasure Dive</span>
    </button>
  </main>

  <div class="footer">
    Games load directly inside this page, so students stay in one tab.
  </div>
</div>

<section id="gameScreen" aria-hidden="true">
  <div class="game-toolbar">
    <button type="button" class="toolbar-btn" id="backBtn">← GAMES</button>
    <div id="currentTitle">Game</div>
    <button type="button" class="toolbar-btn secondary" id="reloadBtn">↻ RESTART</button>
  </div>
  <div class="frame-wrap">
    <iframe
      id="gameFrame"
      title="Trackpad practice game"
      allow="autoplay; fullscreen"
      referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
</section>

<script>
(() => {
  const gameScreen = document.getElementById('gameScreen');
  const frame = document.getElementById('gameFrame');
  const title = document.getElementById('currentTitle');
  const backBtn = document.getElementById('backBtn');
  const reloadBtn = document.getElementById('reloadBtn');
  let currentUrl = '';

  function openGame(name, url) {
    currentUrl = url;
    title.textContent = name;
    frame.src = url;
    gameScreen.classList.add('show');
    gameScreen.setAttribute('aria-hidden', 'false');
    document.body.classList.add('game-open');
    backBtn.focus();
  }

  function closeGame() {
    frame.src = 'about:blank';
    currentUrl = '';
    gameScreen.classList.remove('show');
    gameScreen.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('game-open');
  }

  document.querySelectorAll('.game-card').forEach(btn => {
    btn.addEventListener('click', () => {
      openGame(btn.dataset.name, btn.dataset.url);
    });
  });

  backBtn.addEventListener('click', closeGame);

  reloadBtn.addEventListener('click', () => {
    if (!currentUrl) return;
    frame.src = 'about:blank';
    requestAnimationFrame(() => {
      frame.src = currentUrl;
    });
  });

  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && gameScreen.classList.contains('show')) {
      closeGame();
    }
  });
})();
</script>
</body>
</html>
