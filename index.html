<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trackpad Click Practice</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#eef1f5;color:#1f2937}
body.playing{overflow:hidden}
.menu{max-width:1120px;margin:0 auto;padding:18px}
header{text-align:center;margin-bottom:18px}
h1{margin:0 0 7px;font-size:clamp(32px,5vw,52px);line-height:1}
.subtitle{margin:0;font-size:18px;font-weight:800;color:#596275}
.note{display:inline-block;margin-top:11px;padding:7px 13px;border:2px solid #d8dde7;border-radius:999px;background:white;font-weight:900;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.game-card{min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:white;border:3px solid #dce1ea;border-radius:18px;padding:12px 10px;cursor:pointer;color:inherit;box-shadow:0 3px 0 rgba(0,0,0,.05)}
.game-card:hover,.game-card:focus-visible{border-color:#70798c;outline:none;transform:translateY(-2px)}
.game-card:active{transform:translateY(0)}
.icon{font-size:42px;line-height:1}
.game-name{font-size:18px;font-weight:900;text-align:center;line-height:1.1}
.player{display:none;position:fixed;inset:0;background:#dfe3e9;z-index:20}
.player.show{display:flex;flex-direction:column}
.toolbar{flex:0 0 auto;display:grid;grid-template-columns:auto auto auto 1fr auto auto;gap:7px;align-items:center;padding:7px;background:white;border-bottom:2px solid #ccd2db}
.toolbar button{min-height:42px;border:0;border-radius:10px;padding:7px 11px;font-weight:900;font-size:14px;cursor:pointer}
.primary{background:#1f2937;color:white}
.secondary{background:#e9edf3;color:#1f2937}
.backup{background:#fff3cd;color:#5b4300;border:1px solid #e6c95c!important}
#title{text-align:center;font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 5px}
.frame-shell{flex:1 1 auto;min-height:0;padding:5px;display:flex}
#frameHost{flex:1;min-width:0;min-height:0;background:white;border-radius:7px;overflow:hidden;border:1px solid #cfd5de;position:relative}
#frameHost iframe{width:100%;height:100%;border:0;background:white;display:block}
.loading{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:20px;font-weight:900;color:#596275;background:white}
.statusbar{flex:0 0 auto;background:white;border-top:1px solid #d7dce4;padding:5px 10px;text-align:center;font-size:12px;font-weight:700;color:#6b7280}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){
  .menu{padding:12px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .game-card{min-height:115px}
  .toolbar{grid-template-columns:auto auto auto 1fr auto}
  #prevBtn{display:none}
  .toolbar button{font-size:13px;padding:6px 9px}
  #title{font-size:15px}
}
</style>
</head>
<body>

<section class="menu" id="menu">
<header>
  <h1>Trackpad Click Practice</h1>
  <p class="subtitle">Choose a game and practice clicking.</p>
  <div class="note">CLICK ONLY • NO DRAGGING • SAME TAB</div>
</header>
<div class="grid" id="grid"></div>
</section>

<section class="player" id="player" aria-hidden="true">
  <div class="toolbar">
    <button id="gamesBtn" class="primary" type="button">← GAMES</button>
    <button id="restartBtn" class="secondary" type="button">↻ RESTART</button>
    <button id="backupBtn" class="backup" type="button">TRY BACKUP</button>
    <div id="title">Game</div>
    <button id="prevBtn" class="secondary" type="button">◀ PREV</button>
    <button id="nextBtn" class="secondary" type="button">NEXT ▶</button>
  </div>
  <div class="frame-shell"><div id="frameHost"></div></div>
  <div class="statusbar" id="statusbar">Game-only view. If one is blank, click TRY BACKUP.</div>
</section>

<script>
(() => {
  // PRIMARY = Funbrain's direct game files (game only, no site links).
  // BACKUP = official Funbrain game page in the SAME iframe if a direct game file ever fails.
  const games = [
    {name:'Apple Catch', icon:'🍎', direct:'https://www.funbrain.com/content/js_games/apple_catch/', backup:'https://www.funbrain.com/games/apple-catch'},
    {name:'Bumble Numbers', icon:'🐝', direct:'https://www.funbrain.com/content/js_games/bumble_numbers/', backup:'https://www.funbrain.com/games/bumble-numbers'},
    {name:'Cake Monster', icon:'🍰', direct:'https://www.funbrain.com/content/js_games/cake_monster/', backup:'https://www.funbrain.com/games/cake-monster'},
    {name:'Coyote Concentration', icon:'🃏', direct:'https://www.funbrain.com/content/js_games/coyote_concentration/game.html', backup:'https://www.funbrain.com/games/coyote-concentration'},
    {name:'Digging for Worms', icon:'🪱', direct:'https://www.funbrain.com/content/js_games/digging_for_worms/', backup:'https://www.funbrain.com/games/digging-for-worms'},
    {name:'Frost Bite', icon:'❄️', direct:'https://www.funbrain.com/content/js_games/frost_bite/', backup:'https://www.funbrain.com/games/frost-bite'},
    {name:'Log Run', icon:'🪵', direct:'https://www.funbrain.com/content/js_games/log_run/', backup:'https://www.funbrain.com/games/log-run'},
    {name:'Penguin Drop', icon:'🐧', direct:'https://www.funbrain.com/content/js_games/penguin_drop/', backup:'https://www.funbrain.com/games/penguin-drop'},
    {name:'Pickle Pop', icon:'🥒', direct:'https://www.funbrain.com/content/js_games/pickle_pop/', backup:'https://www.funbrain.com/games/pickle-pop'},
    {name:'Pig Pile', icon:'🐷', direct:'https://www.funbrain.com/content/js_games/pig_pile/', backup:'https://www.funbrain.com/games/pig-pile'},
    {name:'Shape Invasion', icon:'🔷', direct:'https://www.funbrain.com/content/js_games/shape_invasion/', backup:'https://www.funbrain.com/games/shape-invasion'},
    {name:'Simon Sees', icon:'👀', direct:'https://www.funbrain.com/content/js_games/simon_sees/', backup:'https://www.funbrain.com/games/simon-sees'},
    {name:'Star Climber', icon:'⭐', direct:'https://www.funbrain.com/content/js_games/star_climber/', backup:'https://www.funbrain.com/games/star-climber'},
    {name:'Swing Fling', icon:'🐦', direct:'https://www.funbrain.com/content/js_games/swing_fling/', backup:'https://www.funbrain.com/games/swing-fling'},
    {name:'Switch', icon:'🍓', direct:'https://www.funbrain.com/content/js_games/switch/', backup:'https://www.funbrain.com/games/switch'},
    {name:'Treasure Dive', icon:'🤿', direct:'https://www.funbrain.com/content/js_games/treasure_dive/game.html', backup:'https://www.funbrain.com/games/treasure-dive'}
  ];

  const grid = document.getElementById('grid');
  const menu = document.getElementById('menu');
  const player = document.getElementById('player');
  const frameHost = document.getElementById('frameHost');
  const title = document.getElementById('title');
  const statusbar = document.getElementById('statusbar');
  const gamesBtn = document.getElementById('gamesBtn');
  const restartBtn = document.getElementById('restartBtn');
  const backupBtn = document.getElementById('backupBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  let current = 0;
  let usingBackup = false;

  games.forEach((g, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'game-card';
    b.innerHTML = `<span class="icon">${g.icon}</span><span class="game-name">${g.name}</span>`;
    b.addEventListener('click', () => openGame(i));
    grid.appendChild(b);
  });

  function setFrame(url, label) {
    frameHost.innerHTML = `<div class="loading">Loading ${label}…</div>`;
    setTimeout(() => {
      const f = document.createElement('iframe');
      f.title = label;
      f.src = url;
      f.setAttribute('allow', 'autoplay; fullscreen');
      f.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
      frameHost.replaceChildren(f);
    }, 100);
  }

  function openGame(i) {
    current = (i + games.length) % games.length;
    usingBackup = false;
    const g = games[current];
    title.textContent = `${g.icon} ${g.name}`;
    menu.style.display = 'none';
    player.classList.add('show');
    player.setAttribute('aria-hidden','false');
    document.body.classList.add('playing');
    statusbar.textContent = 'Game-only view. If this one is blank, click TRY BACKUP.';
    setFrame(g.direct, g.name);
  }

  function closePlayer() {
    frameHost.replaceChildren();
    player.classList.remove('show');
    player.setAttribute('aria-hidden','true');
    document.body.classList.remove('playing');
    menu.style.display = '';
  }

  gamesBtn.addEventListener('click', closePlayer);

  restartBtn.addEventListener('click', () => {
    const g = games[current];
    setFrame(usingBackup ? g.backup : g.direct, g.name);
  });

  backupBtn.addEventListener('click', () => {
    const g = games[current];
    usingBackup = true;
    statusbar.textContent = 'Backup view: official Funbrain page, still kept inside this tab.';
    setFrame(g.backup, g.name + ' backup');
  });

  prevBtn.addEventListener('click', () => openGame(current - 1));
  nextBtn.addEventListener('click', () => openGame(current + 1));

  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && player.classList.contains('show')) closePlayer();
  });
})();
</script>
</body>
</html>
