<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trackpad Click Practice</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#eef1f5;color:#1f2937}body.playing{overflow:hidden}.menu{max-width:1120px;margin:auto;padding:22px}header{text-align:center;margin-bottom:22px}h1{margin:0 0 8px;font-size:clamp(34px,5vw,54px)}.subtitle{margin:0;font-size:20px;font-weight:800;color:#596275}.note{display:inline-block;margin-top:13px;padding:8px 15px;border:2px solid #d8dde7;border-radius:999px;background:#fff;font-weight:900;font-size:14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.game-card{min-height:145px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#fff;border:3px solid #dce1ea;border-radius:22px;padding:16px 12px;cursor:pointer;color:inherit;box-shadow:0 3px 0 rgba(0,0,0,.05)}.game-card:disabled{opacity:.6;cursor:wait}.icon{font-size:48px}.game-name{font-size:21px;font-weight:900;text-align:center}.player{display:none;position:fixed;inset:0;background:#dfe3e9;z-index:20}.player.show{display:flex;flex-direction:column}.toolbar{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:8px;align-items:center;padding:8px;background:#fff;border-bottom:2px solid #ccd2db}.toolbar button{min-height:46px;border:0;border-radius:11px;padding:8px 14px;font-weight:900;font-size:16px;cursor:pointer}.toolbar button:disabled{opacity:.55;cursor:wait}.primary{background:#1f2937;color:#fff}.secondary{background:#e9edf3;color:#1f2937}#title{text-align:center;font-size:21px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.frame-shell{flex:1;min-height:0;padding:6px;display:flex}#frameHost{flex:1;min-width:0;min-height:0;background:#fff;border-radius:8px;overflow:hidden;border:1px solid #cfd5de}#frameHost iframe{width:100%;height:100%;border:0;background:#fff;display:block}.loading{height:100%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#596275}.statusbar{background:#fff;border-top:1px solid #d7dce4;padding:5px 10px;text-align:center;font-size:12px;font-weight:700;color:#6b7280}@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:680px){.menu{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{grid-template-columns:auto auto 1fr auto}#prevBtn{display:none}.toolbar button{font-size:14px;padding:7px 10px}#title{font-size:16px}}
</style></head><body><section class="menu" id="menu"><header><h1>Trackpad Click Practice</h1><p class="subtitle">Choose a game and practice clicking.</p><div class="note">CLICK ONLY • NO DRAGGING • ONE TAB</div></header><div class="grid" id="grid"></div></section><section class="player" id="player" aria-hidden="true"><div class="toolbar"><button id="gamesBtn" class="primary">← GAMES</button><button id="restartBtn" class="secondary">↻ RESTART</button><div id="title">Game</div><button id="prevBtn" class="secondary">◀ PREV</button><button id="nextBtn" class="secondary">NEXT ▶</button></div><div class="frame-shell"><div id="frameHost"></div></div><div class="statusbar" id="statusbar">Only the game loads below. Use the buttons above — no new tabs.</div></section><script>
(()=>{const games=[['Apple Catch','https://mouse-practice.com/games/mp/mp01/g01/index.html','🍎'],['Bumble Numbers','https://mouse-practice.com/games/mp/mp01/g02/index.html','🐝'],['Cake Monster','https://mouse-practice.com/games/mp/mp01/g03/index.html','🍰'],['Coyote Concentration','https://www.funbrain.com/content/js_games/coyote_concentration/game.html','🃏'],['Digging for Worms','https://mouse-practice.com/games/mp/mp01/g07/index.html','🪱'],['Frost Bite','https://mouse-practice.com/games/mp/mp01/g08/index.html','❄️'],['Log Run','https://mouse-practice.com/games/mp/mp01/g10/index.html','🪵'],['Penguin Drop','https://mouse-practice.com/games/mp/mp01/g12/index.html','🐧'],['Pickle Pop','https://mouse-practice.com/games/mp/mp01/g13/index.html','🥒'],['Pig Pile','https://mouse-practice.com/games/mp/mp01/g14/index.html','🐷'],['Shape Invasion','https://mouse-practice.com/games/mp/mp01/g16/index.html','🔷'],['Simon Sees','https://mouse-practice.com/games/mp/mp01/g17/index.html','👀'],['Star Climber','https://mouse-practice.com/games/mp/mp01/g18/index.html','⭐'],['Swing Fling','https://mouse-practice.com/games/mp/mp01/g19/index.html','🐦'],['Switch','https://mouse-practice.com/games/mp/mp01/g20/index.html','🍓'],['Treasure Dive','https://mouse-practice.com/games/mp/mp01/g21/index.html','🤿']];
const grid=document.getElementById('grid'),menu=document.getElementById('menu'),player=document.getElementById('player'),host=document.getElementById('frameHost'),title=document.getElementById('title'),status=document.getElementById('statusbar'),gamesBtn=document.getElementById('gamesBtn'),restartBtn=document.getElementById('restartBtn'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');let current=0,locked=false,timer=null,firstMouse=true;games.forEach((g,i)=>{const b=document.createElement('button');b.className='game-card';b.innerHTML=`<span class="icon">${g[2]}</span><span class="game-name">${g[0]}</span>`;b.onclick=()=>open(i,true);grid.appendChild(b)});const cards=[...document.querySelectorAll('.game-card')];function lock(v){locked=v;[restartBtn,prevBtn,nextBtn,...cards].forEach(b=>b.disabled=v)}function cancel(){if(timer){clearTimeout(timer);timer=null}}function load(g,initial){cancel();lock(true);host.innerHTML='<div class="loading">Loading game…</div>';let d=900;if(initial&&firstMouse&&g[1].includes('mouse-practice.com')){d=1200+Math.floor(Math.random()*5000);firstMouse=false;status.textContent='Starting game…'}else status.textContent='Loading game…';timer=setTimeout(()=>{timer=null;host.replaceChildren();const f=document.createElement('iframe');f.title=g[0];f.src=g[1];f.setAttribute('allow','autoplay; fullscreen');f.setAttribute('referrerpolicy','no-referrer-when-downgrade');f.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-pointer-lock');host.appendChild(f);f.addEventListener('load',()=>{status.textContent='Only the game loads below. Use the buttons above — no new tabs.';setTimeout(()=>lock(false),700)},{once:true});setTimeout(()=>lock(false),5000)},d)}function open(i,initial=false){if(locked)return;current=(i+games.length)%games.length;const g=games[current];title.textContent=g[2]+' '+g[0];menu.style.display='none';player.classList.add('show');player.setAttribute('aria-hidden','false');document.body.classList.add('playing');load(g,initial)}function close(){cancel();host.replaceChildren();lock(false);player.classList.remove('show');player.setAttribute('aria-hidden','true');document.body.classList.remove('playing');menu.style.display='';status.textContent='Only the game loads below. Use the buttons above — no new tabs.'}gamesBtn.onclick=close;restartBtn.onclick=()=>{if(!locked)load(games[current],false)};prevBtn.onclick=()=>{if(!locked)open(current-1,false)};nextBtn.onclick=()=>{if(!locked)open(current+1,false)};addEventListener('keydown',e=>{if(e.key==='Escape'&&player.classList.contains('show'))close()})})();
</script></body></html>
